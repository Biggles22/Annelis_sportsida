name: Publicera GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hämta källkoden
        uses: actions/checkout@v6

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5

      - name: Hämta aktuell NHL-data
        run: node scripts/build-nhl-data.mjs

      - name: Paketera webbplatsen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
